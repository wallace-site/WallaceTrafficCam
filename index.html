<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Traffic Cameras</title>
    <style>
        /* Default Light Mode Variables */
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333333;
            --subtitle-color: #666666;
            --card-bg: #ffffff;
            --border-color: #eeeeee;
            --placeholder-bg: #dddddd;
            --accent-color: #0066cc;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
        }

        /* Automatic Dark Mode Variables */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #f0f0f0;
                --subtitle-color: #a0a0a0;
                --card-bg: #1e1e1e;
                --border-color: #2e2e2e;
                --placeholder-bg: #2a2a2a;
                --accent-color: #58a6ff;
                --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
                --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1 { margin: 0 0 10px 0; }
        p.subtitle { color: var(--subtitle-color); margin-bottom: 40px; }

        .camera-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .camera-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            width: calc(33.333% - 25px);
            min-width: 320px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease;
        }
        
        .camera-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .camera-card img {
            width: 100%;
            height: auto;
            display: block;
            aspect-ratio: 16/9;
            object-fit: cover;
            background-color: var(--placeholder-bg);
        }

        .camera-info {
            padding: 15px;
            font-size: 14px;
            text-align: left;
            border-top: 1px solid var(--border-color);
            line-height: 1.5;
        }

        .timestamp {
            color: var(--accent-color);
            font-weight: 500;
            margin-top: 4px;
            display: block;
        }

        /* Fullscreen Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            max-width: 95vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close:hover { color: #ff4757; }

        .modal-caption {
            color: #fff;
            margin-top: 20px;
            font-size: 18px;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 0 20px;
        }

        .loading {
            font-size: 18px;
            color: var(--subtitle-color);
            padding: 40px;
        }

        @media (max-width: 1024px) {
            .camera-card { width: calc(50% - 25px); }
        }
        @media (max-width: 768px) {
            .camera-card { width: 100%; }
        }
    </style>
</head>
<body>

    <h1>Live Traffic Cameras</h1>
    <p class="subtitle">Woodlands & BKE Live Views</p>

    <div id="loading" class="loading">Fetching live camera feeds...</div>
    <div id="camera-container" class="camera-container"></div>

    <!-- Fullscreen Modal -->
    <div id="fullscreenModal" class="modal">
        <span class="close" id="closeModal">&times;</span>
        <img class="modal-content" id="modalImg" alt="Fullscreen Traffic Camera">
        <div id="modalCaption" class="modal-caption"></div>
    </div>

    <script>
        const API_URL = 'https://api.data.gov.sg/v1/transport/traffic-images';

        // Locked to specific Woodlands & BKE camera IDs
        const PREFERRED_CAMERAS = [
            { id: '2701', name: 'Woodlands Causeway (Towards Johor)' },
            { id: '2702', name: 'Woodlands Checkpoint (Towards BKE)' },
            { id: '2704', name: 'BKE (Before Woodlands Checkpoint)' }
        ];

        // Format ISO timestamp to Singapore Date & Time
        function formatTimestamp(isoString) {
            if (!isoString) return 'Timestamp unavailable';
            const date = new Date(isoString);
            return date.toLocaleString('en-SG', {
                timeZone: 'Asia/Singapore',
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
        }

        async function fetchCameras() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    const allCameras = data.items[0].cameras;

                    const selectedCameras = PREFERRED_CAMERAS.map(pref => {
                        const found = allCameras.find(cam => cam.camera_id === pref.id);
                        return found ? { ...found, customName: pref.name } : null;
                    }).filter(Boolean);

                    renderCameras(selectedCameras);
                } else {
                    document.getElementById('loading').innerText = "No camera data available right now.";
                }
            } catch (error) {
                console.error("Error fetching camera data:", error);
                document.getElementById('loading').innerText = "Failed to load camera feeds.";
            }
        }

        function renderCameras(cameras) {
            const container = document.getElementById('camera-container');
            document.getElementById('loading').style.display = 'none';

            cameras.forEach(cam => {
                const resString = `${cam.image_metadata.width} x ${cam.image_metadata.height}px`;
                const formattedTime = formatTimestamp(cam.timestamp);
                
                const card = document.createElement('div');
                card.className = 'camera-card';
                card.innerHTML = `
                    <img src="${cam.image}" alt="${cam.customName}">
                    <div class="camera-info">
                        <strong>${cam.customName}</strong><br>
                        Camera ID: ${cam.camera_id} | ${resString}
                        <span class="timestamp">Captured: ${formattedTime}</span>
                    </div>
                `;

                card.addEventListener('click', () => {
                    openModal(cam.image, `${cam.customName} (ID: ${cam.camera_id}) — Captured: ${formattedTime}`);
                });
                
                container.appendChild(card);
            });
        }

        // Fullscreen Modal Logic
        const modal = document.getElementById('fullscreenModal');
        const modalImg = document.getElementById('modalImg');
        const modalCaption = document.getElementById('modalCaption');
        const closeBtn = document.getElementById('closeModal');

        function openModal(imgSrc, caption) {
            modal.style.display = "flex";
            modalImg.src = imgSrc;
            modalCaption.innerText = caption;
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            modal.style.display = "none";
            document.body.style.overflow = "auto";
        }

        closeBtn.onclick = closeModal;
        window.onclick = function(event) {
            if (event.target == modal) closeModal();
        }
        window.addEventListener('keydown', function(event) {
            if (event.key === "Escape") closeModal();
        });

        fetchCameras();
    </script>
</body>
</html>
